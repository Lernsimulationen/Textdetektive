<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081311">
  <title>KI · Mensch · Verantwortung</title>
  <style>
    :root{color-scheme:dark;--bg:#07110f;--panel:#10201d;--panel2:#18312c;--line:#315951;--text:#f0f5ee;--muted:#a8bdb5;--teal:#79c9c1;--gold:#e7bd4b;--red:#e6635d;--shadow:0 18px 50px #0006}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 80% 0,#1a433a 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
    .app{height:100vh;display:flex;flex-direction:column}.topbar{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px);border-bottom:1px solid #ffffff12;background:#091613dd;backdrop-filter:blur(18px)}.brand{margin:0;color:var(--teal);font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.top-actions{display:flex;gap:8px;align-items:center}.main{height:calc(100vh - 58px);width:min(1420px,100%);margin:auto;padding:18px clamp(16px,4vw,52px) 22px;overflow:hidden}.view{height:100%;min-height:0;overflow:hidden}.hidden{display:none!important}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,4vw,4rem);line-height:1.02;margin-bottom:10px}h2{font-size:clamp(1.35rem,2.4vw,2.25rem);line-height:1.08;margin-bottom:8px}h3{font-size:1.05rem;margin-bottom:5px}.eyebrow{color:var(--gold);font-size:.7rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.muted{color:var(--muted)}.small{font-size:.83rem}.accent{color:var(--teal)}
    .button{border:0;border-radius:10px;padding:10px 14px;background:var(--teal);color:#06201b;font-weight:800}.button.secondary{border:1px solid var(--line);background:transparent;color:var(--text)}.button.danger{border:1px solid #92504a;background:transparent;color:#ff9b91}.actions{display:flex;flex-wrap:wrap;gap:8px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#162c27f5,#0d1b18f5);box-shadow:var(--shadow);padding:18px}.image-card{padding:0;overflow:hidden}.image-card img{display:block;width:100%;height:100%;object-fit:cover}.image-card .copy{padding:16px}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#ffffff12;color:var(--muted);font-size:.72rem}.bar{height:8px;border-radius:99px;background:#06100e;overflow:hidden}.bar span{display:block;height:100%;border-radius:inherit;background:var(--teal)}
    .start-screen{height:100%;display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.start-story{position:relative;overflow:hidden;display:flex;align-items:end;padding:clamp(22px,4vw,54px);border:1px solid var(--line);border-radius:22px;background:linear-gradient(90deg,#07110ff5 0%,#07110fc8 42%,#07110f22),url('bilder/kommissionszentrale.png') center/cover;box-shadow:var(--shadow)}.start-story .copy{max-width:680px}.start-story p{font-size:1.03rem;max-width:650px}.start-side{display:grid;grid-template-rows:1fr auto;gap:18px;min-width:0}.identity-card{display:flex;flex-direction:column;justify-content:space-between}.identity-preview{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.avatar-stage{height:190px;position:relative;border-radius:16px;background:radial-gradient(circle at 50% 30%,#2d554d,#0a1714 70%);overflow:hidden}.avatar-photo{position:absolute;inset:0;background-image:url('bilder/avatar-sprite.png');background-size:300% 500%;background-repeat:no-repeat;background-color:#e9d9bc}.rank-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ffffff12;padding:8px 0}.rank-line:last-child{border-bottom:0}.save-card{display:flex;align-items:center;justify-content:space-between;gap:15px}
    .dashboard{height:100%;display:grid;grid-template-rows:auto 1fr 210px;gap:14px}.status-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.status{padding:13px 16px;border:1px solid var(--line);border-radius:13px;background:#0c1b18;min-width:0}.status strong{display:block;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status small{display:block;color:var(--muted);margin-bottom:2px}.dashboard-middle{min-height:0;display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.story-card{min-height:0;overflow:hidden;display:grid;grid-template-columns:1.15fr .85fr}.story-card img{width:100%;height:100%;min-height:0;object-fit:cover}.story-card .copy{padding:22px;overflow:hidden}.story-card p{max-width:680px}.route-card{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.route{min-height:0;display:flex;flex-direction:column;justify-content:space-between;padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(150deg,#1a3530,#0d1c19)}.route h3{margin-top:8px}.route p{font-size:.82rem}.route .button{align-self:flex-start}.module-rail{min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow:hidden}.module-tile{position:relative;min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b1714}.module-tile img{width:100%;height:100%;object-fit:cover;opacity:.56}.module-tile .module-copy{position:absolute;inset:auto 0 0;padding:12px;background:linear-gradient(transparent,#06100ee8 38%)}.module-tile h3{font-size:.95rem}.module-tile p{margin:0;color:var(--muted);font-size:.78rem}.module-tile button{margin-top:8px}
    .section-page{height:100%;display:grid;grid-template-rows:auto 1fr;gap:14px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:14px}.section-head p{max-width:800px;margin:0}.tutorial-grid{height:100%;display:grid;grid-template-columns:repeat(4,1fr) 1.25fr;gap:10px}.step{border:1px solid var(--line);border-radius:14px;padding:16px;background:#0d1c19}.step b{display:block;color:var(--gold);font-size:1.5rem}.safety{border-left:4px solid var(--red)}.safety li{margin:6px 0;color:var(--muted)}.commission-layout{height:100%;display:grid;grid-template-rows:160px 1fr;gap:14px}.commission-intro{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}.commission-intro img{width:100%;height:160px;object-fit:cover;border-radius:14px}.commission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-height:0;overflow:hidden}.mission-column{min-height:0;overflow:hidden}.mission-column .mission-list{height:calc(100% - 34px);overflow:auto}.mission-list{display:grid;gap:8px}.mission{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0b1714}.mission.done{border-color:#668c52}.mission.locked{opacity:.48}.mission strong{font-size:.86rem}.mission .button{padding:7px 9px;font-size:.76rem;flex:none}
    .journal-layout,.profile-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}.journal-layout .image-card{display:grid;grid-template-columns:1fr 1fr}.journal-layout img{min-height:0}.journal-layout .copy{overflow:hidden}.profile-layout{grid-template-columns:.8fr 1.2fr}.profile-card{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.live-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}.live-layout img{height:100%;min-height:0;object-fit:cover;border-radius:16px}
    .studio{height:100%;display:grid;grid-template-columns:280px 1fr;gap:14px}.studio-preview{display:flex;flex-direction:column;justify-content:space-between}.studio-preview .avatar-stage{height:300px}.studio-controls{min-height:0;display:grid;grid-template-rows:auto auto 1fr;gap:12px}.control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control-group{border:1px solid var(--line);border-radius:13px;padding:12px;min-height:0}
    dialog{width:min(720px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;padding:0;background:var(--panel);color:var(--text);box-shadow:0 30px 90px #000b}dialog::backdrop{background:#000b}.dialog-body{padding:22px}label{display:grid;gap:5px;margin-bottom:12px;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#091512;color:var(--text)}textarea{min-height:110px;resize:vertical}
    @media(max-width:900px){.start-screen{grid-template-columns:1fr}.start-story{min-height:330px}.dashboard-middle{grid-template-columns:1fr}.story-card{grid-template-columns:1fr 1fr}.route-card{grid-template-columns:repeat(4,1fr)}.route{padding:10px}.route p{display:none}.dashboard{grid-template-rows:auto 1fr 180px}.tutorial-grid{grid-template-columns:repeat(2,1fr);overflow:auto}.commission-grid{grid-template-columns:repeat(3,280px);overflow:auto}.studio{grid-template-columns:220px 1fr}}
    @media(max-width:620px){.topbar{height:52px}.main{height:calc(100vh - 52px);padding:12px}.brand{font-size:.65rem}.start-story{min-height:270px;padding:22px}.identity-preview{grid-template-columns:110px 1fr}.avatar-stage{height:160px}.status-strip{gap:5px}.status{padding:9px}.status strong{font-size:1rem}.dashboard{grid-template-rows:auto 1fr 165px;gap:8px}.story-card{grid-template-columns:1fr}.story-card img{display:none}.story-card .copy{padding:16px}.route-card{grid-template-columns:repeat(4,175px);overflow:auto}.module-rail{grid-template-columns:repeat(4,220px);overflow:auto}.studio{grid-template-columns:1fr;overflow:auto}.studio-preview .avatar-stage{height:180px}.control-row{grid-template-columns:1fr}.profile-card,.journal-layout,.profile-layout,.live-layout{grid-template-columns:1fr}.journal-layout img,.live-layout img{display:none}.section-head{align-items:start}.section-head p{font-size:.82rem}}
    .avatar-choice-grid{display:grid;grid-template-columns:repeat(6,minmax(92px,1fr));gap:8px;max-height:280px;overflow:auto}.avatar-choice{display:grid;gap:4px;text-align:left;padding:6px;border:1px solid var(--line);border-radius:10px;background:#0b1714;color:var(--text);cursor:pointer}.avatar-choice .avatar-photo{position:relative;inset:auto;height:112px;border-radius:7px;background-size:300% 500%;background-color:#e9d9bc}.avatar-choice strong{font-size:.78rem}.avatar-choice small{color:var(--muted);font-size:.68rem}.avatar-choice.active{border-color:var(--avatar-accent,var(--gold));box-shadow:0 0 0 1px var(--avatar-accent,var(--gold))}.bio-help{color:var(--muted);font-size:.78rem;line-height:1.4;margin:0 0 8px}.color-skill-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.color-skill{display:grid;gap:6px;justify-items:start;padding:9px;border:1px solid var(--line);border-radius:10px;background:#0b1714;color:var(--text);cursor:pointer}.color-skill span{width:22px;height:22px;border-radius:50%;background:var(--skill-color);box-shadow:0 0 0 2px #ffffff1a}.color-skill strong{font-size:.7rem}.color-skill.active{border-color:var(--skill-color);box-shadow:0 0 0 1px var(--skill-color)}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar"><p class="brand">KI-Ethik-Kommission · Missionszentrale</p><div class="top-actions"><button class="button secondary" id="home-button" data-go="dashboard" hidden>Dashboard</button><button class="button secondary" id="export-top">Speicherstand sichern</button></div></div>
    <main class="main"><div id="content" class="view"></div></main>
  </div>
  <dialog id="mission-dialog"><div class="dialog-body"><button class="button secondary" id="close-dialog">Schließen</button><div id="mission-detail" style="margin-top:16px"></div></div></dialog>
  <input id="file-input" type="file" accept="application/json,.json" hidden>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const avatarCatalog=[
      {id:'m1',name:'Adam',gender:'male',sprite:0,bio:'Adam sucht nach klaren Regeln, ohne die Menschen hinter einer Entscheidung aus dem Blick zu verlieren.'},
      {id:'m2',name:'Amir',gender:'male',sprite:1,bio:'Amir verbindet Technikinteresse mit der Frage, wem neue Systeme wirklich nützen.'},
      {id:'m3',name:'Elias',gender:'male',sprite:2,bio:'Elias hört lange zu und prüft, ob ein Fortschritt auch gerecht und menschenwürdig ist.'},
      {id:'m4',name:'Jonas',gender:'male',sprite:3,bio:'Jonas interessiert sich für Politik und dafür, wie Verantwortung verteilt und sichtbar gemacht wird.'},
      {id:'m5',name:'Paul',gender:'male',sprite:4,bio:'Paul bringt Neugier, Widerspruch und Freude an gut begründeten Gegenfragen mit.'},
      {id:'f1',name:'Ayla',gender:'female',sprite:6,bio:'Ayla achtet auf leise Stimmen und darauf, welche Folgen Entscheidungen im Alltag haben.'},
      {id:'f2',name:'Clara',gender:'female',sprite:7,bio:'Clara ordnet komplexe Fälle und sucht nach einer Sprache, die verständlich und fair bleibt.'},
      {id:'f3',name:'Dalia',gender:'female',sprite:8,bio:'Dalia verbindet gesellschaftliche Beobachtung mit einem wachen Sinn für Macht und Teilhabe.'},
      {id:'f4',name:'Mira',gender:'female',sprite:9,bio:'Mira fragt, welche Menschenbilder in Daten und Algorithmen verborgen liegen.'},
      {id:'f5',name:'Nora',gender:'female',sprite:10,bio:'Nora möchte lernen, in Konflikten klar zu bleiben und trotzdem im Gespräch zu bleiben.'},
      {id:'n1',name:'Noa Levin',gender:'nonbinary',sprite:13,bio:'Noa verbindet einen wachen Blick für politische Macht mit Fragen nach Würde, Gewissen und Verantwortung.'}
    ];
    const colorSkills=[{id:'teal',name:'Mooslicht',color:'#79c9c1'},{id:'gold',name:'Sonnenkern',color:'#e7bd4b'},{id:'coral',name:'Korallenfunke',color:'#e6635d'},{id:'violet',name:'Dämmerblau',color:'#a58bd7'},{id:'cream',name:'Papierlicht',color:'#e8d5ad'}];
    const defaultAvatar={id:'n1',name:'Noa Levin',gender:'nonbinary',sprite:13,bio:'Noa verbindet einen wachen Blick für politische Macht mit Fragen nach Würde, Gewissen und Verantwortung.',colorSkill:'teal'};
    const seed=[['Mission 0 · Einladung','Das erste Gespräch','GEM','Deine Stimme zählt'],['Eintritt in die Kommission','Protokoll Null','GEM','Die Einladung'],['Ausbildung I','Blick schärfen','ER','Erste Orientierung'],['Ausbildung II','Systemblick','SW','Zweite Orientierung'],['Erstes Einsatzgebiet','Signal im Rauschen','GEM','Auftaktmission'],['KI verstehen I','Maschinenraum','SW','Grundlagenlabor'],['KI verstehen II','Grenzfragen','ER','Deutungsraum'],['Daten analysieren I','Datenspur','SW','Prüfauftrag'],['Daten analysieren II','Unsichtbare Muster','GEM','Kreuzprüfung'],['Verantwortung übernehmen','Zurechnung','ER','Verantwortungsmatrix'],['Gesellschaftliche Folgen I','Resonanz','SW','Folgenabschätzung'],['Gesellschaftliche Folgen II','Würde unter Druck','ER','Schutzauftrag'],['Öffentlichkeit','Offenes Protokoll','SW','Kommunikationslage'],['Konfliktzone','Rote Linie','GEM','Dilemma'],['Ethikrat I','Anhörung','ER','Votum vorbereiten'],['Ethikrat II','Interessenausgleich','SW','Votum prüfen'],['Krisensimulation I','Ausfall','GEM','Lagewechsel'],['Krisensimulation II','Zeitfenster','SW','Entscheidung unter Druck'],['Krisensimulation III','Gewissensraum','ER','Letzte Prüfung'],['Abschlussmission','Mandat','GEM','Kommissionsvotum'],['Übergabe','Horizont','GEM','Neues Mandat']];
    const course={title:'KI · Mensch · Verantwortung',subtitle:'Evangelische Religionslehre × Sozialwissenschaften',intro:'Eine neue Generation autonomer Systeme verändert Entscheidungen, Institutionen und Selbstbilder. Die Kommission braucht Menschen, die genauer hinsehen.',chapters:seed.map((x,i)=>({id:`kapitel-${i+1}`,order:i+1,title:x[0],codename:x[1],perspective:x[2],teaser:x[3],xp:i===20?240:100+(i%4)*20,briefing:i===0?'Deine erste Aufgabe ist kein Test. Du klärst, wer du bist, was du erwartest und welche Regeln dich schützen.':'Untersuche den Fall aus mehreren Perspektiven und dokumentiere dein Urteil.'}))};
    const modules=[{id:'orientierung',kicker:'01 · Orientierung',title:'Die Kommission betritt den Raum',description:'Starte mit einer Frage, nicht mit einer fertigen Antwort.',image:'bilder/kommissionszentrale.png'},{id:'perspektiven',kicker:'02 · Perspektiven',title:'Drei Blickrichtungen, ein Fall',description:'Technik, Gesellschaft und Menschenbilder gehören zusammen.',image:'bilder/sektorenkarte.png'},{id:'selbstlernen',kicker:'03 · Selbstlernen',title:'Lernen in kleinen Missionen',description:'Lies, prüfe, probiere aus und halte eine Spur fest.',image:'bilder/lerntagebuch.png'},{id:'dialog',kicker:'04 · Dialog',title:'Urteilen heißt begründen',description:'Vergleiche Argumente und entwickle dein Votum.',image:'bilder/dialog-labor.png'}];
    const state={view:'start',course,modules,completed:[],notes:{},avatar:JSON.parse(JSON.stringify(defaultAvatar)),votes:{Zustimmung:0,Unentschieden:0,Widerspruch:0}};
    const completed=()=>state.completed.length;const current=()=>state.course.chapters.find(c=>!state.completed.includes(c.id));
    function rank(){return ['Anwärter:in','Analyst:in','Delegierte:r','Kommissionsrat','Mandatsträger:in'][Math.min(4,Math.floor(completed()/4))]}
    function spritePosition(index){const col=index%3,row=Math.floor(index/3);return `${col*50}% ${row*25}%`}
    function currentAvatar(){return avatarCatalog.find(a=>a.id===state.avatar.id)||avatarCatalog[10]}
    function avatarMarkup(big=false){const a=currentAvatar(),skill=colorSkills.find(c=>c.id===state.avatar.colorSkill)||colorSkills[0];return `<div class="avatar-stage ${big?'big':''}" style="--avatar-accent:${skill.color}"><div class="avatar-photo" style="background-position:${spritePosition(a.sprite)}"></div></div>`}
    function render(){const views={start:renderStart,dashboard:renderDashboard,tutorial:renderTutorial,commission:renderCommission,journal:renderJournal,profile:renderProfile,live:renderLive,avatar:renderAvatar};$('home-button').hidden=!['dashboard','start'].includes(state.view);$('export-top').hidden=state.view==='start';views[state.view]();}
    function renderStart(){ $('content').innerHTML=`<section class="start-screen"><article class="start-story"><div class="copy"><p class="eyebrow">Die Einladung</p><h1>Du bist nicht hier, um eine fertige Antwort zu liefern.</h1><p>Du bist hier, weil KI-Systeme längst Entscheidungen beeinflussen: in Behörden, Schulen, Medien, Religion, Arbeit und im Alltag. Die Frage ist nicht nur, was Maschinen können. Die Frage ist, welche Menschen wir sein wollen, wenn Maschinen mitentscheiden.</p><p>Die KI-Ethik-Kommission sucht Lernende, die beobachten, widersprechen, zuhören und Verantwortung begründen können.</p></div></article><div class="start-side"><article class="card identity-card"><div><p class="eyebrow">Als Erstes: deine Identität</p><h2>${esc(state.avatar.name)}</h2><div class="identity-preview">${avatarMarkup()}<div><p class="muted small">${esc(state.avatar.bio)}</p><div class="rank-line"><span>Rang</span><strong>${rank()}</strong></div><div class="rank-line"><span>Missionen</span><strong>${completed()} / ${state.course.chapters.length}</strong></div></div></div></div><div class="actions"><button class="button" data-go="avatar">Avatar-Studio öffnen</button><button class="button secondary" id="start-journey">Mit dieser Identität starten</button></div></article><article class="card save-card"><div><strong>Schon begonnen?</strong><p class="muted small">Lade deinen lokalen Speicherstand.</p></div><button class="button secondary" id="import-start">Speicherstand laden</button></article></div></section>`;bind();}
    function renderDashboard(){const c=current(),p=Math.round(completed()/state.course.chapters.length*100);$('content').innerHTML=`<section class="dashboard"><div class="status-strip"><div class="status"><small>Fortschritt</small><strong>${p}%</strong><div class="bar"><span style="width:${p}%"></span></div></div><div class="status"><small>Nächste Mission</small><strong>${c?esc(c.title):'Abgeschlossen'}</strong></div><div class="status"><small>Dein Rang</small><strong>${rank()}</strong></div></div><div class="dashboard-middle"><article class="card story-card"><img src="bilder/kommissionszentrale.png" alt="Kommissionsraum mit leerem Stuhl"><div class="copy"><p class="eyebrow">Deine Einsatzlage</p><h2>Die Welt hat kein Problem zu wenig. Sie hat Entscheidungen zu viel.</h2><p class="muted">Autonome Systeme sortieren Menschen, empfehlen Handlungen und schreiben an Bildern von Zukunft mit. Manche Entscheidungen wirken objektiv, obwohl in ihnen Werte, Interessen und Macht stecken.</p><p class="muted">Deine Kommission arbeitet deshalb wie ein Gegenraum: Du lernst, Fälle zu prüfen, Perspektiven nebeneinanderzulegen und ein Urteil zu entwickeln, das nicht laut sein muss, aber begründbar.</p><div class="actions"><button class="button" data-open="${c?.id||''}">${c?'Nächste Mission':'Lernweg abgeschlossen'}</button><button class="button secondary" data-go="tutorial">Tutorial</button></div></div></article><div class="route-card"><article class="route"><div><span class="tag">01</span><h3>Tutorial</h3><p class="muted">Ablauf, Schutzregeln und Ziel der Kommission.</p></div><button class="button secondary" data-go="tutorial">Öffnen</button></article><article class="route"><div><span class="tag">02</span><h3>Mission-Kommission</h3><p class="muted">Arbeitsfelder, Fälle und Abzweigungen.</p></div><button class="button secondary" data-go="commission">Öffnen</button></article><article class="route"><div><span class="tag">03</span><h3>Lerntagebuch</h3><p class="muted">Gedanken, Wendepunkte und nächste Fragen.</p></div><button class="button secondary" data-go="journal">Öffnen</button></article><article class="route"><div><span class="tag">04</span><h3>Persönliche Akte</h3><p class="muted">Avatar, Rang, Profil und Sicherung.</p></div><button class="button secondary" data-go="profile">Öffnen</button></article></div></div><section class="module-rail">${state.modules.map(m=>`<article class="module-tile"><img src="${esc(m.image)}" alt=""><div class="module-copy"><p class="eyebrow">${esc(m.kicker)}</p><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p></div></article>`).join('')}</section></section>`;bind();}
    function renderTutorial(){ $('content').innerHTML=`<section class="section-page"><div class="section-head"><div><p class="eyebrow">Tutorial</p><h2>Vom ersten Namen zum begründeten Votum</h2><p class="muted">Das Dashboard ist deine Zentrale. Du entscheidest, welchen Weg du als Nächstes öffnest.</p></div></div><div class="tutorial-grid"><div class="step"><b>01</b><h3>Identität</h3><p class="muted">Wähle Avatar, Namen und Rolle. Mission 0 fragt, was du mitbringst.</p></div><div class="step"><b>02</b><h3>Orientierung</h3><p class="muted">Verstehe, warum die Kommission existiert und welche Regeln dich schützen.</p></div><div class="step"><b>03</b><h3>Abzweigungen</h3><p class="muted">Arbeite in Politik, Gesellschaft oder Bibelperspektive weiter.</p></div><div class="step"><b>04</b><h3>Votum</h3><p class="muted">Begründe eine Entscheidung und darfst sie durch neue Gründe verändern.</p></div><article class="card safety"><p class="eyebrow">Schutz und Noten</p><h3>Die Akte gehört dir.</h3><ul><li>Nutze ein Pseudonym statt deines vollständigen Namens.</li><li>Keine privaten Daten von dir oder anderen.</li><li>Notizen sind Lernspuren, keine automatische Bewertung.</li><li>Noten und Rückmeldungen werden nur bewusst in einem Export geteilt.</li><li>Bei Unsicherheit: stoppen und eine Lehrkraft fragen.</li></ul></article></div></section>`;bind();}
    function renderCommission(){const groups=[['GEM','Gemeinsame Perspektive'],['ER','Bibel & Menschenbild'],['SW','Politik & Gesellschaft']];$('content').innerHTML=`<section class="commission-layout"><div class="commission-intro card"><div><p class="eyebrow">Mission-Kommission</p><h2>Du kannst den Weg verzweigen, aber nicht die Verantwortung abkürzen.</h2><p class="muted">Wähle ein Arbeitsfeld. Die Fälle führen dich von der Einladung über Analyse und Perspektivwechsel bis zu einem eigenen Votum.</p></div><img src="bilder/sektorenkarte.png" alt="Drei verbundene Arbeitsfelder"></div><div class="commission-grid">${groups.map(([id,label])=>`<article class="mission-column card"><span class="tag">${id}</span><h3>${label}</h3><div class="mission-list">${state.course.chapters.filter(c=>c.perspective===id).map(ch=>{const i=state.course.chapters.indexOf(ch),locked=i>0&&!state.completed.includes(state.course.chapters[i-1].id);return `<div class="mission ${state.completed.includes(ch.id)?'done':''} ${locked?'locked':''}"><div><strong>${esc(ch.title)}</strong><p class="muted small">${esc(ch.teaser)}</p></div><button class="button secondary" ${locked?'disabled':''} data-open="${esc(ch.id)}">${state.completed.includes(ch.id)?'Ansehen':'Öffnen'}</button></div>`}).join('')}</div></article>`).join('')}</div></section>`;bind();}
    function renderJournal(){$('content').innerHTML=`<section class="journal-layout"><article class="card image-card"><img src="bilder/lerntagebuch.png" alt="Offenes Lerntagebuch"><div class="copy"><p class="eyebrow">Lerntagebuch</p><h2>Was verändert sich in dir?</h2><p class="muted">Ein Lerntagebuch sammelt nicht nur Lösungen. Es zeigt, wann du gezögert, umgedacht oder eine neue Frage gefunden hast.</p><textarea id="journal-note" placeholder="Heute nehme ich mit ...">${esc(state.notes.journal||'')}</textarea><div class="actions"><button class="button" id="save-journal">Eintrag speichern</button></div></div></article><article class="card"><p class="eyebrow">Deine Spuren</p><h2>${Object.keys(state.notes).length} Notizen</h2><p class="muted">${completed()} von ${state.course.chapters.length} Missionen abgeschlossen.</p><div class="bar"><span style="width:${completed()/state.course.chapters.length*100}%"></span></div><p class="question" style="margin-top:18px">Welche Entscheidung würdest du heute anders begründen als am Anfang?</p></article></section>`;bind();}
    function renderProfile(){$('content').innerHTML=`<section class="profile-layout"><article class="card profile-card"><div>${avatarMarkup(true)}</div><div><p class="eyebrow">Persönliche Akte</p><h2>${esc(state.avatar.name)}</h2><p class="muted">${esc(state.avatar.bio)}</p><div class="rank-line"><span>Rang</span><strong>${rank()}</strong></div><div class="rank-line"><span>Missionen</span><strong>${completed()} / ${state.course.chapters.length}</strong></div><div class="actions" style="margin-top:14px"><button class="button" data-go="avatar">Avatar ändern</button></div></div></article><article class="card"><p class="eyebrow">Sicherung</p><h2>Deine Akte bleibt in deiner Hand.</h2><p class="muted">Es gibt keine automatische Cloud-Speicherung. Exportiere deinen Stand nur, wenn du ihn sichern oder bewusst weitergeben möchtest.</p><div class="actions"><button class="button" id="export-profile">Speicherstand exportieren</button><button class="button secondary" id="import-profile">Speicherstand laden</button></div></article></section>`;bind();}
    function renderLive(){$('content').innerHTML=`<section class="live-layout"><article class="card"><p class="eyebrow">Eigenständiges Untergame</p><h2>Live-Labor</h2><p class="muted">Das Live-Labor ist vom Lernspiel getrennt. Es wird nur für gemeinsame Sitzungen aktiviert und darf deinen persönlichen Lernstand nicht verändern.</p><div class="tag">Aktuell: lokale Demo ohne Netzwerk</div></article><img src="bilder/dialog-labor.png" alt="Gemeinsamer Tisch für ein Dialoglabor"><article class="card"><p class="eyebrow">Offline-Probe</p><h3>Anonyme Abstimmung</h3><p class="muted">Diese Probe bleibt lokal. Eine spätere Raumcode-/Supabase-Variante wird als eigenes Untergame ergänzt.</p>${Object.entries(state.votes).map(([n,c])=>`<button class="button secondary choice" data-vote="${n}">${n}<strong>${c}</strong></button>`).join('')}<button class="button danger" id="reset-votes">Ergebnisse zurücksetzen</button></article></section>`;bind();document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{state.votes[b.dataset.vote]++;renderLive()});$('reset-votes').onclick=()=>{state.votes={Zustimmung:0,Unentschieden:0,Widerspruch:0};renderLive()};}
    function renderAvatar(){const selected=currentAvatar();$('content').innerHTML=`<section class="studio"><article class="card studio-preview"><div><p class="eyebrow">Avatar-Studio</p><h2>${esc(selected.name)}</h2>${avatarMarkup(true)}<p class="muted small">${esc(state.avatar.bio)}</p><p class="bio-help">Diese Biografie gehört der Rolle, die du in diesem Projektkurs spielen möchtest – nicht dir als Privatperson.</p></div><div class="actions"><button class="button" id="save-avatar">Identität speichern</button><button class="button secondary" data-go="start">Zur Startseite</button></div></article><div class="studio-controls"><section class="control-group"><p class="eyebrow">Wähle deine Rolle</p><p class="muted small">Fünf männliche, fünf weibliche und ein non-binärer Avatar stehen als Rasterbilder bereit.</p><div class="avatar-choice-grid">${avatarCatalog.map(a=>`<button class="avatar-choice ${a.id===selected.id?'active':''}" data-avatar="${a.id}"><span class="avatar-photo" style="background-position:${spritePosition(a.sprite)}"></span><strong>${esc(a.name)}</strong><small>${a.gender==='male'?'männlich':a.gender==='female'?'weiblich':'non-binär'}</small></button>`).join('')}</div></section><section class="control-group"><p class="eyebrow">Rollenbiografie</p><p class="bio-help">Schreibe hier die Biografie der Figur, die du im Projektkurs spielen möchtest. Es ist ausdrücklich nicht deine eigene Lebensgeschichte.</p><textarea id="bio" maxlength="500" placeholder="Welche Erfahrungen, Fragen und Werte bringt diese Rolle mit?">${esc(state.avatar.bio)}</textarea></section><section class="control-group"><p class="eyebrow">Farbskill</p><p class="muted small">Wähle eine Farbe als sichtbares Zeichen für die Stärke deiner Rolle.</p><div class="color-skill-grid">${colorSkills.map(c=>`<button class="color-skill ${state.avatar.colorSkill===c.id?'active':''}" data-color="${c.id}" style="--skill-color:${c.color}"><span></span><strong>${esc(c.name)}</strong></button>`).join('')}</div></section></div></section>`;document.querySelectorAll('[data-avatar]').forEach(b=>b.onclick=()=>{const a=avatarCatalog.find(x=>x.id===b.dataset.avatar);state.avatar={...state.avatar,...a};renderAvatar()});$('bio').oninput=()=>{state.avatar.bio=$('bio').value};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state.avatar.colorSkill=b.dataset.color;renderAvatar()});$('save-avatar').onclick=()=>{state.view='dashboard';render();openMission('kapitel-1')};}
    function openMission(id){const c=state.course.chapters.find(x=>x.id===id);if(!c)return;const isWelcome=id==='kapitel-1',old=state.notes[id]||'',parsed=(()=>{try{return JSON.parse(old)}catch{return {}}})();$('mission-detail').innerHTML=`<p class="eyebrow">${esc(c.perspective)} · ${c.xp} XP</p><h2>${esc(c.title)}</h2><p class="muted">${isWelcome?'Dein persönlicher Check-in: Was bringst du in diese Kommission mit?':esc(c.briefing)}</p>${isWelcome?`<label>Pseudonym<input id="alias" maxlength="40" value="${esc(parsed.alias||state.avatar.name)}"></label><label>Kurs oder Lerngruppe<input id="group" maxlength="60" value="${esc(parsed.group||'')}"></label><label>Meine erste Frage<textarea id="voice" maxlength="800">${esc(parsed.voice||'')}</textarea></label><label><input id="rules" type="checkbox" ${parsed.rules?'checked':''}> Schutzregeln gelesen</label>`:`<label>Meine Notiz<textarea id="mission-note">${esc(old)}</textarea></label>`}<button class="button" id="complete">Mission abschließen</button>`;$('complete').onclick=()=>{if(isWelcome){state.avatar.name=$('alias').value.trim()||state.avatar.name;state.notes[id]=JSON.stringify({alias:state.avatar.name,group:$('group').value.trim(),voice:$('voice').value.trim(),rules:$('rules').checked})}else state.notes[id]=$('mission-note').value;if(!state.completed.includes(id))state.completed.push(id);$('mission-dialog').close();state.view='dashboard';render()};$('mission-dialog').showModal()}
    function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.view=b.dataset.go;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openMission(b.dataset.open));$('export-top').onclick=exportProject;$('import-start')?.addEventListener('click',()=>$('file-input').click());$('start-journey')?.addEventListener('click',()=>{state.view='dashboard';render();openMission('kapitel-1')});$('export-profile')?.addEventListener('click',exportProject);$('import-profile')?.addEventListener('click',()=>$('file-input').click());$('save-journal')?.addEventListener('click',()=>{state.notes.journal=$('journal-note').value;saveNotice('Tagebucheintrag gespeichert.')});}
    function saveNotice(message){const n=document.createElement('div');n.className='tag';n.textContent=message;n.style.position='fixed';n.style.right='18px';n.style.bottom='18px';n.style.zIndex='10';document.body.append(n);setTimeout(()=>n.remove(),2200)}
    function exportProject(){const blob=new Blob([JSON.stringify({format:'ki-mensch-verantwortung',version:3,course:state.course,modules:state.modules,avatar:state.avatar,project:{completed:state.completed,notes:state.notes,votes:state.votes}},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ki-mensch-verantwortung-akte.json';a.click();URL.revokeObjectURL(a.href);saveNotice('Speicherstand exportiert.')}
    $('close-dialog').onclick=()=>$('mission-dialog').close();$('file-input').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.format!=='ki-mensch-verantwortung'||!data.project||!data.avatar)throw Error('Diese Datei gehört nicht zu diesem Projekt.');Object.assign(state,{avatar:data.avatar,completed:Array.isArray(data.project.completed)?data.project.completed.filter(x=>typeof x==='string'):[],notes:data.project.notes&&typeof data.project.notes==='object'?data.project.notes:{},votes:data.project.votes||state.votes,view:'dashboard'});render();saveNotice('Speicherstand geladen.')}catch(err){alert(err.message)}e.target.value=''};
    render();
  </script>
</body>
</html>
